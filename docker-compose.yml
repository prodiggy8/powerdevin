services:
  postgres:
    image: postgres:17-alpine
    container_name: powerdevin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: powerdevin
      POSTGRES_PASSWORD: powerdevin
      POSTGRES_DB: powerdevin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powerdevin -d powerdevin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
